button{font:inherit}
a{color:var(--aqua);text-decoration:none}

.logo{font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--neon),var(--aqua));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:10px;font-size:17px;cursor:pointer}
.tab{padding:6px 11px;border-radius:9px;color:#9aa0c0;cursor:pointer;border:1px solid transparent;font-size:13.5px;background:none}
.tab:hover{color:#fff}
.tab.on{color:#fff;background:var(--panel2);border-color:var(--edge)}
.tab.off{opacity:.35;cursor:not-allowed}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.btn{background:var(--panel2);border:1px solid var(--edge);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--neon)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(90deg,var(--neon),#5b8cff);border-color:transparent;font-weight:700}
.btn.lime{background:linear-gradient(90deg,#65a30d,var(--lime));border-color:transparent;color:#0d1503;font-weight:700}
.btn.danger{border-color:var(--rose);color:var(--rose);background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
input,select,textarea{background:#0d0f1c;border:1px solid var(--edge);border-radius:9px;color:#e6e8f5;padding:8px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--neon)}
textarea{width:100%;min-height:64px;resize:vertical}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--edge);border-radius:99px;padding:3px 10px;font-size:12px;color:#aab1d4;margin:2px}
.chip.lock{opacity:.45}
.muted{color:#9aa0c0;font-size:13px}
.small{font-size:12.5px}
.h1{font-size:26px;font-weight:800;margin:8px 0}
.h2{font-size:16px;font-weight:700;margin:14px 0 8px}
.bar{height:8px;background:#0d0f1c;border-radius:9px;overflow:hidden;border:1px solid var(--edge);flex:1;min-width:90px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--aqua))}
.bar i.hot{background:linear-gradient(90deg,#f59e0b,var(--rose))}
.blk{background:#181c30;border:1px solid var(--edge);border-left:4px solid var(--neon);border-radius:9px;padding:4px 8px;margin:4px 0;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.blk.k-control{border-left-color:var(--lime)} .blk.k-sensing{border-left-color:var(--aqua)} .blk.k-look{border-left-color:#f59e0b} .blk.k-game{border-left-color:var(--rose)}
.blk .x{color:var(--rose);cursor:pointer;margin-left:auto;background:none;border:none;padding:0 4px}
.kids{margin-left:18px;border-left:2px dashed var(--edge);padding-left:8px}
.msg{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:88%}
.msg.me{background:linear-gradient(90deg,rgba(124,92,255,.25),rgba(34,211,238,.18));margin-left:auto}
.msg.ai{background:var(--panel2);border:1px solid var(--edge)}
canvas.stage{width:100%;max-width:520px;border:1px solid var(--edge);border-radius:12px;background:#000;display:block}
table{width:100%;border-collapse:collapse} td,th{padding:7px 8px;border-bottom:1px solid var(--edge);text-align:left;font-size:13.5px}
.badge{padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.free{background:#1d2440;color:#9aa0c0}.badge.pro{background:rgba(124,92,255,.2);color:#b7a7ff;border:1px solid var(--neon)}.badge.max{background:linear-gradient(90deg,rgba(163,230,53,.25),rgba(34,211,238,.25));color:#d8ffa8;border:1px solid var(--lime)}
.plan{border:1px solid var(--edge);border-radius:14px;padding:16px;background:var(--panel)}
.plan.hot{border-color:var(--neon)}
.price{font-size:26px;font-weight:800;margin:4px 0}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.bat{position:relative;width:38px;height:20px;background:#0d0f1c;border:1px solid var(--edge);border-radius:99px;flex:none}
.bat i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:99px;background:#9aa0c0;transition:all .15s}
.bat.on{background:rgba(124,92,255,.4);border-color:var(--neon)}
.bat.on i{left:20px;background:var(--neon)}
.sttabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.log{background:#0d0f1c;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font:12px/1.6 ui-monospace,monospace;color:#9aa0c0}
.thumb{width:100%;border-radius:10px;border:1px solid var(--edge)}
</style>
</head>

function pickTemplate(prompt){
 var p=(prompt||"").toLowerCase();
 if(/cave|mine|dark|spy|ghost/.test(p)) return {name:"Gem Cave",bg:"#141225|#080a14",theme:"cave",orbs:5,chase:3.4,size:24};

   bl("whenFlag",{},[bl("goto",{x:240,y:160}),bl("point",{deg:90}),bl("say",{text:one(prompt,"Go!")})].concat(orbSpawns(orbs))),
   bl("whenKey",{key:"ArrowUp"},[bl("point",{deg:0}),bl("move",{steps:speed})]),
   bl("whenKey",{key:"ArrowRight"},[bl("point",{deg:90}),bl("move",{steps:speed})]),

 ]};

 return {bg:t.bg,sprites:[
   {name:"hero",shape:"arrow",color:"#22d3ee",size:22,x:240,y:160,dir:90,blocks:heroBlocks},

}

function argHTML(b,path,def){
 var out="";
 (def.args||[]).forEach(function(a){
  var an=a.n,v=b.args&&b.args[an]!=null?b.args[an]:a.d;
  if(a.t==="key"){ out+='<select data-act="arg" data-path="'+path+'" data-an="'+an+'">'+opts(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","W","A","S","D"," "],v)+'</select>'; }
  else if(a.t==="shape"){ out+='<select data-act="arg" data-path="'+path+'" data-an="'+an+'">'+opts(["arrow","circle","square","diamond","star"],v||"circle")+'</select>'; }
  else if(a.t==="color"){ out+='<input type="color" value="'+esc(v)+'" style="padding:1px;width:42px;height:26px" data-act="arg" data-path="'+path+'" data-an="'+an+'">'; }
  else if(a.t==="num"){ out+='<input type="number" step="any" value="'+esc(v)+'" style="width:74px" data-act="arg" data-path="'+path+'" data-an="'+an+'">'; }
  else { out+='<input type="text" value="'+esc(v)+'" style="width:130px" data-act="arg" data-path="'+path+'" data-an="'+an+'">'; }
 });
 return out;
}

function go(view){ if(view==="billing"){ S.view="settings"; S.stTab="billing"; } else { S.view=view; } render(); }
function findProj(id){ for(var i=0;i<S.projects.length;i++) if(S.projects[i].id===id) return S.projects[i]; }
function listByPath(pop,path){
 var pp=path.split(".").map(Number), list=pop.blocks, parent=null;
 for(var i=0;i<pp.length-1;i++){ parent=list[pp[i]]; list=parent.children; }
 return {list:list,idx:pp[pp.length-1]};
}
var ACTS={
 go:function(a){ go(a.view); },

 play:function(a){ var p=findProj(a.id); if(p){ S.cur=p.id; go("publish"); } },
 del:function(a){ if(!confirm("Delete this project?")) return; S.projects=S.projects.filter(function(p){return p.id!==a.id;}); if(S.cur===a.id)S.cur=null; },
 newGame:function(){
  var p=createProject(val("ngName")||"Untitled Game",val("ngPrompt"),val("ngMode"));

 },

  var p=createProject("Orb Rush (demo)","a glowing arcade chase: collect every orb, dodge the chaser","ai");
  p.squad=suggestAgents(S.tier,p.prompt);
  p.program=buildProgram(p.prompt,p.params);
  p.chat=[{who:"sys",text:"Demo loaded — this is what a squad run compiles to. Open the block editor to see inside, or publish right away."}];
  S.view="build"; render(); save();
 },
 engine:function(a){ S.useRealApi=(a.v==="real"); },
 chatSend:function(){
  var p=cur(); if(!p) return; var t=val("chatIn").trim(); if(!t) return;
  p.prompt=p.prompt?p.prompt+"\n"+t:t;
  p.chat.push({who:"me",text:t});

 },
 toEditor:function(){ S.view="editor"; render(); save(); },
 addAgent:function(){ var p=cur(); if(!p||p.squad.length>=PLANS[S.tier].squadMax) return;
  var pool=MODELS.filter(function(m){return canUseModel(S.tier,m);});
  p.squad.push({id:uid(),role:["designer","programmer","artist","qa","narrative","producer","audio"][p.squad.length%7],model:pool[p.squad.length%pool.length].id}); },
 delAgent:function(a){ var p=cur(); if(p) p.squad.splice(+a.i,1); },
 agentModel:function(a){ var p=cur(); if(p&&p.squad[+a.i]) p.squad[+a.i].model=a.v; },
 agentRole:function(a){ var p=cur(); if(p&&p.squad[+a.i]) p.squad[+a.i].role=a.v; },
 autoSquad:function(){ var p=cur(); if(p) p.squad=suggestAgents(S.tier,p.prompt); },
 runSquad:async function(){
  var p=cur(); if(!p||p.busy) return;
  if(!p.squad.length){ alert("Add at least one agent first."); return; }
  var cost=squadCost(p.squad.length,S.tier);
  if(!consume(cost.total,"AI squad run · "+p.squad.length+" agents · "+p.name)){ alert("Not enough tokens: needs "+fmt(cost.total)+", you have "+fmt(tokensAvail())+". Free up or top up in Billing."); return; }
  p.busy=true;
  p.chat.push({who:"me",text:p.prompt||"(build me a game!)"});
  p.chat.push({who:"sys",text:"Squad launched · "+p.squad.length+" agents · cost "+fmt(cost.total)+" tokens"+(S.tier==="free"?" (incl. +50K flat overhead)":S.tier==="pro"?" (incl. 5× overhead)":" (incl. 10× overhead)")});
  save(); render();
  for(var i=0;i<p.squad.length;i++){
   var ag=p.squad[i],text;
   if(S.useRealApi){
    try{
     var prov=el("provSel")?el("provSel").value:(S.leadProv||"openrouter"); S.leadProv=prov;
     text=await callProvider("You are the "+roleById(ag.role).label+" of a game-dev AI squad. Game brief: "+(p.prompt||"a fun tiny arcade game")+". Reply with 2-3 short sentences performing your job. If you are the Programmer, end with a block list (whenFlag/whenKey/forever/move/point/goto/spawn/edgeBounce).",ag.model,prov);
     text="🤖 ["+roleById(ag.role).label+" · "+modelById(ag.model).name+" · real API] "+text;
    }catch(e){
     text="⚠️ Real API failed ("+e.message.slice(0,140)+") — fell back to the built-in brain.\n"+mockChat(ag,p.prompt,S.tier);
    }
   } else text=mockChat(ag,p.prompt,S.tier);
   p.chat.push({who:"ai",text:text});
   p.updatedAt=now(); save(); render();
  }
  if(p.squad.some(function(a){return a.role==="programmer";})||!p.program) p.program=buildProgram(p.prompt,p.params);
  p.chat.push({who:"sys",text:"✅ Run complete · program compiled → live preview updated. Open the block editor to tweak, or Publish."});
  p.busy=false; p.updatedAt=now(); save(); render();
 },
 spriteSel:function(a){ var p=cur(); if(p){ p.spriteSel=+a.i; } },
 addSprite:function(){ var p=cur(); if(!p||!p.program) return;
  p.program.sprites.push({name:"sprite"+p.program.sprites.length,shape:"circle",color:"#a3e635",size:22,x:100,y:100,dir:90,blocks:[]});
  p.spriteSel=p.program.sprites.length-1; },
 delSprite:function(){ var p=cur(); if(!p||!p.program||p.program.sprites.length<2) return;
  p.program.sprites.splice(p.spriteSel,1); p.spriteSel=0; },
 bg:function(a){ var p=cur(); if(!p||!p.program) return; var bgv=(p.program.bg||"#101426|#0a0c18").split("|"); bgv[+a.n]=a.v; p.program.bg=bgv.join("|"); },
 addTop:function(a){ var p=cur(); if(!p||!p.program||!a.v) return;
  var sp=p.program.sprites[p.spriteSel]||p.program.sprites[0]; if(!sp) return;
  var def=BLOCK_DEFS[a.v];
  if(def.kids){ sp.blocks.push(bl(a.v,{},[])); }
  else{
   var last=sp.blocks[sp.blocks.length-1];
   if(last&&last.children&&BLOCK_DEFS[last.kind]&&BLOCK_DEFS[last.kind].kids) last.children.push(bl(a.v));
   else sp.blocks.push(bl("whenFlag",{},[bl(a.v)]));
  }
  p.updatedAt=now(); save(); render(); },
 addChild:function(a){ if(!a.v) return; var p=cur(); if(!p||!p.program) return;
  var ref=listByPath(p.program,a.path); var def=BLOCK_DEFS[a.v];
  ref.list[ref.idx].children.push(bl(a.v,{},def.kids?[]:undefined));
  p.updatedAt=now(); save(); render(); },
 arg:function(a){ var p=cur(); if(!p||!p.program) return;
  var ref=listByPath(p.program,a.path); var b=ref.list[ref.idx];
  if(b) b.args[a.an]=(a.an==="text")?a.v:(isNaN(parseFloat(a.v))?a.v:parseFloat(a.v));
  p.updatedAt=now(); save(); },
 delBlk:function(a){ var p=cur(); if(!p||!p.program) return; var ref=listByPath(p.program,a.path); ref.list.splice(ref.idx,1); p.updatedAt=now(); save(); render(); },
 mvUp:function(a){ var p=cur(); if(!p||!p.program) return; var ref=listByPath(p.program,a.path); var i=ref.idx; if(i>0){ var t=ref.list[i-1]; ref.list[i-1]=ref.list[i]; ref.list[i]=t; } p.updatedAt=now(); save(); render(); },
 mvDn:function(a){ var p=cur(); if(!p||!p.program) return; var ref=listByPath(p.program,a.path); var i=ref.idx; if(i<ref.list.length-1){ var t=ref.list[i+1]; ref.list[i+1]=ref.list[i]; ref.list[i]=t; } p.updatedAt=now(); save(); render(); },
 publishRun:async function(){
  var p=cur(); if(!p||publish.busy) return;
  var ok=await runPublish(p,function(t){ var e=el("pubStatus"); if(e)e.textContent=t; });
  if(ok){ S.view="publish"; }
  save(); render();
 },
 exportGame:function(a){ var p=findProj(a.id)||cur(); if(!p||!p.program){ alert("Build a game first."); return; }
  download(slug(p.name)+".html",mkGameHtml(p),"text/html"); },
 exportListing:function(a){ var p=findProj(a.id)||cur(); if(!p||!p.published) return;
  try{ navigator.clipboard.writeText(p.published.description); alert("Listing copied to clipboard!"); }catch(e){ download("listing.txt",p.published.description); } },
 remix:function(a){ var p=findProj(a.id); if(!p||!p.program) return;
  var np=createProject(p.name+" (remix)",p.prompt,p.mode); np.program=JSON.parse(JSON.stringify(p.program)); np.params=JSON.parse(JSON.stringify(p.params));
  S.view="editor"; S.cur=np.id; render(); save(); },
 setTier:function(a){
  if(["pro","max"].indexOf(a.v)>=0&&!confirm("Switch to "+PLANS[a.v].name+"? (Demo platform: billing is simulated.)")) return;
  S.tier=a.v; S.poolStart=now();
  S.projects.forEach(function(p){ if(p.squad.length>PLANS[S.tier].squadMax) p.squad=p.squad.slice(0,PLANS[S.tier].squadMax); });
  save(); render();
 },
 buyPack:function(a){ var pk=null; PACKS.forEach(function(x){ if(x.id===a.i) pk=x; }); if(!pk) return;
  S.credits+=pk.tokens;
  S.history.push({at:now(),what:pk.label+" credit pack",amt:pk.price});
  alert(pk.label+" added to your token pool. (Demo platform: payment simulated.)");
  save(); render(); },
 billMode:function(a){ S.billingMode=a.v; },
 stTab:function(a){ S.stTab=a.t; },
 toggleReal:function(){ S.useRealApi=!S.useRealApi; },
 togglePriv:function(a){ S.privacy[a.k]=!S.privacy[a.k]; },
 saveKey:function(a){ var v=val("key_"+a.prov).trim(); if(!v) return; S.keys[a.prov]=v; S.useRealApi=true; save(); render(); },
 saveProfile:function(){ S.profile.name=val("accName")||S.profile.name; S.profile.avatar=val("accAvatar")||"👾"; save(); render(); },
 exportData:function(){ download("gameplatform-data.json",JSON.stringify({profile:S.profile,tier:S.tier,usage:S.usage,projects:S.projects,credits:S.credits},null,2),"application/json"); },
 wipe:function(){ if(!confirm("Erase EVERYTHING on this browser?")) return; localStorage.removeItem(SKEY); location.reload(); }
};
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-act]"); if(!t) return;
 var a=t.dataset; var f=ACTS[a.act];
 if(f){ var r=f(a); if(r&&r.catch) r.catch(function(er){ console.error(er); }); if(!f.async){} save(); render(); }
});
document.addEventListener("change",function(e){
 var t=e.target.closest("[data-act]"); if(!t) return;
 var a=t.dataset;
 if(a.act==="arg"||a.act==="agentModel"||a.act==="agentRole"||a.act==="bg"){
  var f=ACTS[a.act]; if(f){ f(a); save(); render(); }
 }
 else if(a.act==="addChild"||a.act==="addTop"){ var f2=ACTS[a.act]; if(f2){ a.v=e.target.value; f2(a); } }
});
/* ============ render ============ */
var TRAILER_T=null;
function stopTimers(){ if(TRAILER_T){ clearInterval(TRAILER_T); TRAILER_T=null; } }
function render(){
 stopStage();
 var v=S.view||"dashboard", body;
 if(v==="dashboard") body=vDashboard();
 else if(v==="build") body=vBuild();
 else if(v==="editor") body=vEditor();
 else if(v==="publish") body=vPublish();
 else if(v==="gallery") body=vGallery();
 else if(v==="models") body=vModels();
 else body=vSettings();
 el("app").innerHTML=navHTML()+body;
 if(v==="build"||v==="editor") mountStage("stage",v);
 if(v==="publish"){
  var p=cur();
  if(p&&p.published&&p.published.frames.length){
   var fi=0;
   TRAILER_T=setInterval(function(){ fi=(fi+1)%p.published.frames.length; var img=el("trailer"); if(img) img.src=p.published.frames[fi]; },420);
   mountStage("stage",v);
  }
 }
}
render();
</script>
</body>
